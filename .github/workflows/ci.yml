# =============================================================================
# Intégration continue — infra
#
# Deux livrables dans ce repo :
#   1. la qualité de l'IAC (terraform fmt + validate) et des scripts (shellcheck) ;
#   2. l'image Keycloak « optimisée » (realm + thème embarqués), publiée comme
#      les autres services.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: pa-keycloak

jobs:
  quality:
    name: Lint IAC et scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Formatage Terraform
        run: terraform fmt -check -recursive terraform/

      - name: Validation des modules et environnements
        run: |
          set -e
          for dir in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Linter des scripts shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      - name: Validation du realm Keycloak
        run: python3 -c "import json; json.load(open('keycloak/realm-pa-tournament.json')); print('realm JSON valide')"

      - name: Validation de la stack locale
        run: docker compose config --quiet && echo "docker-compose valide"

  image:
    name: Build et publication de l'image Keycloak
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Authentification Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA_CI }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Authentification Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pa/keycloak
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build et push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/keycloak.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
